<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0d0d1a"/>
  <!-- Mean Well PSU -->
  <rect x="20" y="80" width="180" height="140" rx="4" fill="#c0c0c0" stroke="#888" stroke-width="1.5"/>
  <rect x="30" y="90" width="160" height="30" rx="2" fill="#1a1a2e"/>
  <text x="110" y="110" text-anchor="middle" fill="#ccc" font-size="9" font-family="monospace">MEAN WELL LRS-350-12</text>
  <text x="110" y="145" text-anchor="middle" fill="#333" font-size="11" font-family="monospace">12V 29A 350W</text>
  <g fill="#888">
    <rect x="30" y="170" width="20" height="8" rx="1"/><rect x="55" y="170" width="20" height="8" rx="1"/>
    <rect x="80" y="170" width="20" height="8" rx="1"/><rect x="105" y="170" width="20" height="8" rx="1"/>
    <rect x="130" y="170" width="20" height="8" rx="1"/><rect x="155" y="170" width="20" height="8" rx="1"/>
  </g>
  <text x="110" y="200" text-anchor="middle" fill="#666" font-size="7" font-family="monospace">AC INPUT | DC OUTPUT 12V</text>
  <!-- ESP32 Board -->
  <rect x="230" y="90" width="150" height="100" rx="4" fill="#0a2a0a" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="245" y="100" width="55" height="35" rx="2" fill="#111" stroke="#333" stroke-width="0.5"/>
  <text x="272" y="120" text-anchor="middle" fill="#22c55e" font-size="8" font-family="monospace">ESP32</text>
  <rect x="310" y="105" width="60" height="8" rx="1" fill="#22c55e" opacity="0.2"/>
  <rect x="310" y="118" width="40" height="8" rx="1" fill="#22c55e" opacity="0.2"/>
  <g fill="#333">
    <rect x="240" y="145" width="4" height="10"/><rect x="248" y="145" width="4" height="10"/>
    <rect x="256" y="145" width="4" height="10"/><rect x="264" y="145" width="4" height="10"/>
    <rect x="272" y="145" width="4" height="10"/><rect x="280" y="145" width="4" height="10"/>
    <rect x="340" y="145" width="4" height="10"/><rect x="348" y="145" width="4" height="10"/>
    <rect x="356" y="145" width="4" height="10"/><rect x="364" y="145" width="4" height="10"/>
  </g>
  <text x="305" y="175" text-anchor="middle" fill="#22c55e" font-size="7" font-family="monospace">WLED</text>
  <!-- Wires connecting -->
  <line x1="200" y1="130" x2="230" y2="130" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="200" y1="145" x2="230" y2="145" stroke="#333" stroke-width="2"/>
  <text x="215" y="125" text-anchor="middle" fill="#ff6b6b" font-size="6" font-family="monospace">+12V</text>
  <text x="215" y="160" text-anchor="middle" fill="#666" font-size="6" font-family="monospace">GND</text>
  <!-- Labels -->
  <text x="110" y="60" text-anchor="middle" fill="#888" font-size="9" font-family="monospace">FUENTE</text>
  <text x="305" y="60" text-anchor="middle" fill="#888" font-size="9" font-family="monospace">CONTROLADOR</text>
  <text x="200" y="255" text-anchor="middle" fill="#4a4a6a" font-size="10" font-family="monospace">Setup DIY - Sin Caja - Todo a la Vista</text>
  <text x="200" y="275" text-anchor="middle" fill="#22c55e" font-size="9" font-family="monospace">ESP32 + Mean Well + Cables = ~$35 USD</text>
</svg>
